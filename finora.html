<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Finora — Personal Finance Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root{
  --radius-xl:26px; --radius-lg:20px; --radius-md:15px; --radius-sm:11px;
  --font-body:'Inter',-apple-system,sans-serif; --font-display:'Space Grotesk','Inter',sans-serif;
}
*{box-sizing:border-box;}
body{margin:0;}
.theme-light{
  --bg:#E7ECF3; --bg-flat:#EDF1F6;
  --sd:#B9C3D1; --sl:#FFFFFF;
  --sd-soft:#C7D0DC; --sl-soft:#FFFFFF;
  --text-primary:#222A38; --text-secondary:#79869A;
  --accent:#10B981; --accent-2:#06B6D4; --accent-3:#4F46E5;
  --income:#15803D; --expense:#D6265A; --warning:#B45309; --saving:#4338CA;
  --panel-solid:#F1F4F8; --overlay:rgba(20,26,38,0.5);
  --input-bg:#EDF1F6;
}
.theme-dark{
  --bg:#1B1F29; --bg-flat:#1E222C;
  --sd:#12151C; --sl:#262C39;
  --sd-soft:#161A22; --sl-soft:#232936;
  --text-primary:#EEF1F6; --text-secondary:#8991A3;
  --accent:#34D399; --accent-2:#22D3EE; --accent-3:#818CF8;
  --income:#4ADE80; --expense:#FB7185; --warning:#FBBF24; --saving:#A5B4FC;
  --panel-solid:#232936; --overlay:rgba(4,6,10,0.6);
  --input-bg:#20242F;
}
.fn-app{font-family:var(--font-body);background:var(--bg);min-height:100vh;color:var(--text-primary);display:flex;transition:background .3s;}
.fn-app button, .fn-app input, .fn-app select{font-family:inherit;}
.fn-app button{cursor:pointer;}

/* Neumorphic primitives */
.neu-raised{background:var(--bg);border-radius:var(--radius-lg);box-shadow:9px 9px 18px var(--sd), -9px -9px 18px var(--sl);}
.neu-raised-sm{background:var(--bg);border-radius:var(--radius-md);box-shadow:6px 6px 12px var(--sd), -6px -6px 12px var(--sl);}
.neu-inset{background:var(--bg);border-radius:var(--radius-sm);box-shadow:inset 4px 4px 9px var(--sd-soft), inset -4px -4px 9px var(--sl-soft);}
.neu-flat{background:transparent;}
.neu-pressable{transition:box-shadow .15s, transform .1s;}
.neu-pressable:active{box-shadow:inset 4px 4px 9px var(--sd-soft), inset -4px -4px 9px var(--sl-soft); transform:translateY(1px);}

/* Sidebar */
.fn-sidebar{width:250px;flex-shrink:0;padding:22px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
.fn-logo{display:flex;align-items:center;gap:10px;padding:6px 6px 26px;font-family:var(--font-display);font-weight:700;font-size:19px;}
.fn-logo-mark{width:38px;height:38px;border-radius:13px;background:var(--bg);box-shadow:5px 5px 10px var(--sd), -5px -5px 10px var(--sl);display:flex;align-items:center;justify-content:center;color:var(--accent);flex-shrink:0;}
.fn-nav{display:flex;flex-direction:column;gap:7px;flex:1;}
.fn-nav-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:none;background:transparent;color:var(--text-secondary);font-size:13.5px;font-weight:600;text-align:left;width:100%;}
.fn-nav-item:hover{color:var(--text-primary);}
.fn-nav-item.active{background:var(--bg);box-shadow:inset 4px 4px 9px var(--sd-soft), inset -4px -4px 9px var(--sl-soft);color:var(--accent);}
.fn-sidebar-footer{display:flex;flex-direction:column;gap:14px;padding-top:16px;}
.fn-theme-switch{display:flex;gap:6px;padding:5px;border-radius:14px;background:var(--bg);box-shadow:inset 3px 3px 7px var(--sd-soft), inset -3px -3px 7px var(--sl-soft);}
.fn-theme-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;border:none;background:transparent;border-radius:10px;color:var(--text-secondary);font-size:12px;font-weight:700;}
.fn-theme-btn.active{background:var(--bg);box-shadow:4px 4px 8px var(--sd), -4px -4px 8px var(--sl);color:var(--accent);}
.fn-profile-mini{display:flex;align-items:center;gap:10px;padding:10px 6px;border-radius:14px;}
.fn-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;overflow:hidden;position:relative;}
.fn-avatar-img{width:100%;height:100%;object-fit:cover;display:block;}
.fn-avatar-editable{cursor:pointer;}
.fn-avatar-edit-badge{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg);}
.fn-avatar.large{width:56px;height:56px;font-size:21px;}
.fn-profile-name{font-size:13px;font-weight:700;}
.fn-profile-email{font-size:11px;color:var(--text-secondary);}

/* Drawer */
.fn-drawer-overlay{position:fixed;inset:0;background:var(--overlay);z-index:70;display:flex;}
.fn-drawer{width:262px;height:100%;background:var(--bg);padding:20px 16px;overflow-y:auto;}

/* Main */
.fn-main{flex:1;min-width:0;display:flex;flex-direction:column;}
.fn-topbar{display:flex;align-items:center;gap:14px;padding:22px 30px 14px;position:sticky;top:0;z-index:30;background:var(--bg);}
.fn-greeting{font-family:var(--font-display);font-size:21px;font-weight:700;margin:0;}
.fn-subtext{font-size:12.5px;color:var(--text-secondary);margin:3px 0 0;}
.fn-topbar-actions{margin-left:auto;display:flex;align-items:center;gap:10px;}
.fn-icon-btn{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:14px;border:none;background:var(--bg);box-shadow:5px 5px 10px var(--sd), -5px -5px 10px var(--sl);color:var(--text-primary);position:relative;flex-shrink:0;}
.fn-icon-btn:active{box-shadow:inset 3px 3px 7px var(--sd-soft), inset -3px -3px 7px var(--sl-soft);}
.fn-notif-wrap{position:relative;}
.fn-notif-dot{position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--expense);border:2px solid var(--bg);}
.fn-notif-panel{position:absolute;right:0;top:52px;width:306px;background:var(--panel-solid);border-radius:var(--radius-lg);box-shadow:14px 14px 28px var(--sd), -10px -10px 22px var(--sl);padding:10px;z-index:50;}
.fn-notif-title{font-weight:700;font-size:13px;padding:8px 8px 10px;}
.fn-notif-item{display:flex;gap:10px;align-items:flex-start;padding:10px 8px;border-radius:12px;font-size:12.5px;line-height:1.45;}
.fn-notif-item:hover{background:var(--input-bg);}
.fn-notif-item.tone-warning svg{color:var(--warning);} .fn-notif-item.tone-info svg{color:var(--accent-2);} .fn-notif-item.tone-success svg{color:var(--income);}
.fn-empty-mini{padding:16px 8px;font-size:12.5px;color:var(--text-secondary);}

.fn-content{padding:6px 30px 110px;}
.fn-page{display:flex;flex-direction:column;gap:20px;max-width:1260px;}

/* Cards */
.fn-card{background:var(--bg);border-radius:var(--radius-xl);padding:22px 24px;box-shadow:9px 9px 20px var(--sd), -9px -9px 20px var(--sl);}
.fn-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px;flex-wrap:wrap;}
.fn-card-header h3{font-family:var(--font-display);font-size:15.5px;font-weight:700;margin:0;}
.fn-link-btn{display:flex;align-items:center;gap:3px;background:none;border:none;color:var(--accent);font-size:12.5px;font-weight:700;}

.icon-badge{border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:17px;}

/* Grids */
.fn-grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;}
.fn-grid-split{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;align-items:start;}
.fn-side-stack{display:flex;flex-direction:column;gap:18px;}

/* Bank cards (accounts) */
.fn-accounts-scroll{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px;}
.fn-bank-card{min-width:230px;border-radius:22px;padding:20px;color:#fff;position:relative;overflow:hidden;flex-shrink:0;}
.fn-bank-card::after{content:"";position:absolute;top:-40px;right:-40px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,0.10);}
.fn-bank-card::before{content:"";position:absolute;bottom:-60px;left:-30px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,0.06);}
.fn-bank-card-top{display:flex;justify-content:space-between;align-items:flex-start;font-size:12px;opacity:0.9;position:relative;z-index:1;}
.fn-bank-card-type{font-weight:700;letter-spacing:0.02em;}
.fn-bank-card-balance{font-family:var(--font-display);font-size:21px;font-weight:700;margin-top:22px;position:relative;z-index:1;}
.fn-bank-card-bottom{display:flex;justify-content:space-between;align-items:flex-end;margin-top:16px;font-size:11px;opacity:0.85;position:relative;z-index:1;letter-spacing:0.06em;}
.fn-bank-card-delete{width:20px;height:20px;border-radius:50%;border:none;background:rgba(255,255,255,0.18);color:#fff;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0;}
.fn-bank-card-delete:hover{background:rgba(255,255,255,0.32);}

/* Summary card */
.fn-summary-card{display:flex;flex-direction:column;gap:9px;}
.fn-summary-top{display:flex;align-items:center;justify-content:space-between;}
.fn-summary-label{font-size:12px;color:var(--text-secondary);font-weight:600;}
.fn-summary-value{font-family:var(--font-display);font-size:23px;font-weight:700;letter-spacing:-0.01em;font-variant-numeric:tabular-nums;}
.fn-summary-value.income{color:var(--income);} .fn-summary-value.expense{color:var(--expense);} .fn-summary-value.saving{color:var(--saving);}
.fn-summary-delta{font-size:12px;font-weight:700;display:flex;align-items:center;gap:3px;}
.fn-summary-delta.up{color:var(--income);} .fn-summary-delta.down{color:var(--expense);}
.fn-summary-sub{font-size:11.5px;color:var(--text-secondary);}

.fn-only-mobile-flex{display:none;}

/* Watermark (menyatu dengan alur halaman, tidak mengambang) */
.fn-watermark-inline{padding-top:14px;border-top:1px solid var(--sd-soft);text-align:center;opacity:0.6;}
.fn-watermark-name{font-size:11.5px;font-weight:700;color:var(--text-secondary);letter-spacing:0.01em;}
.fn-watermark-ig{display:inline-block;font-size:10.5px;color:var(--accent-2);text-decoration:none;margin-top:2px;}
.fn-watermark-ig:hover{text-decoration:underline;}

/* Auth screen */
.fn-auth-wrap{min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px;color:var(--text-primary);font-family:var(--font-body);}
.fn-auth-card{width:100%;max-width:380px;background:var(--bg);border-radius:var(--radius-xl);box-shadow:9px 9px 20px var(--sd), -9px -9px 20px var(--sl);padding:30px 26px;display:flex;flex-direction:column;}
.fn-auth-fields{display:flex;flex-direction:column;gap:16px;}
.fn-auth-title{font-family:var(--font-display);font-size:19px;font-weight:700;margin:2px 0 4px;text-align:center;}
.fn-auth-sub{font-size:12.5px;color:var(--text-secondary);text-align:center;margin:0 0 20px;line-height:1.5;}
.fn-auth-error{background:rgba(214,38,90,0.12);color:var(--expense);font-size:12px;font-weight:600;padding:9px 12px;border-radius:11px;}
.fn-auth-note{font-size:11px;color:var(--text-secondary);text-align:center;margin:16px 0 0;line-height:1.5;}
.fn-primary-btn.full{width:100%;justify-content:center;}
.fn-qa-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:13px;border-radius:16px;border:none;background:var(--bg);box-shadow:6px 6px 12px var(--sd), -6px -6px 12px var(--sl);font-size:12.5px;font-weight:700;color:var(--text-primary);}
.fn-qa-btn.income svg{color:var(--income);} .fn-qa-btn.expense svg{color:var(--expense);} .fn-qa-btn.transfer svg{color:var(--saving);}

/* Progress */
.fn-progress-track{width:100%;height:9px;border-radius:99px;background:var(--bg);box-shadow:inset 2px 2px 5px var(--sd-soft), inset -2px -2px 5px var(--sl-soft);overflow:hidden;margin-top:5px;}
.fn-progress-fill{height:100%;border-radius:99px;transition:width .5s ease;}

/* Chart card */
.fn-range-tabs{display:flex;gap:4px;padding:4px;border-radius:13px;background:var(--bg);box-shadow:inset 3px 3px 7px var(--sd-soft), inset -3px -3px 7px var(--sl-soft);}
.fn-range-tab{padding:6px 10px;border-radius:9px;border:none;background:transparent;color:var(--text-secondary);font-size:11.5px;font-weight:700;}
.fn-range-tab.active{background:var(--bg);box-shadow:3px 3px 6px var(--sd), -3px -3px 6px var(--sl);color:var(--accent);}

/* Insights */
.fn-insight-list{display:flex;flex-direction:column;gap:10px;}
.fn-insight-item{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;line-height:1.5;background:var(--bg);box-shadow:inset 3px 3px 7px var(--sd-soft), inset -3px -3px 7px var(--sl-soft);padding:11px 12px;border-radius:14px;}

/* Streak */
.fn-streak-row{display:flex;align-items:center;gap:13px;margin-bottom:14px;}
.fn-streak-flame{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--warning),var(--expense));color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.fn-streak-flame.off{background:var(--panel-solid);color:var(--text-secondary);box-shadow:inset 3px 3px 7px var(--sd-soft), inset -3px -3px 7px var(--sl-soft);}
.fn-streak-num{font-family:var(--font-display);font-weight:700;font-size:16px;}
.fn-badges-row{display:flex;flex-wrap:wrap;gap:8px;}
.fn-badge{font-size:11px;font-weight:700;padding:7px 11px;border-radius:99px;background:var(--bg);box-shadow:inset 3px 3px 6px var(--sd-soft), inset -3px -3px 6px var(--sl-soft);color:var(--text-secondary);display:flex;align-items:center;gap:5px;}
.fn-badge.earned{color:var(--warning);}

/* Transaction rows */
.fn-tx-list{display:flex;flex-direction:column;gap:3px;}
.fn-tx-row{display:flex;align-items:center;gap:13px;padding:11px 8px;border-radius:15px;transition:background .15s;}
.fn-tx-row:hover{background:var(--input-bg);}
.fn-tx-info{flex:1;min-width:0;}
.fn-tx-name{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fn-tx-meta{font-size:11.5px;color:var(--text-secondary);margin-top:2px;}
.fn-tx-amount{font-weight:700;font-size:13.5px;font-variant-numeric:tabular-nums;flex-shrink:0;font-family:var(--font-display);}
.fn-tx-amount.income{color:var(--income);} .fn-tx-amount.expense{color:var(--expense);} .fn-tx-amount.transfer{color:var(--saving);}
.fn-tx-delete{width:30px;height:30px;border:none;background:transparent;color:var(--text-secondary);border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.fn-tx-delete:hover{background:var(--bg);box-shadow:inset 3px 3px 6px var(--sd-soft), inset -3px -3px 6px var(--sl-soft);color:var(--expense);}

/* Budget mini + status pill */
.fn-budget-mini-top{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.fn-budget-mini-name{font-size:13.5px;font-weight:700;}
.fn-status-pill{margin-left:auto;font-size:10.5px;font-weight:800;padding:5px 10px;border-radius:99px;flex-shrink:0;}
.fn-status-pill.safe{background:rgba(21,128,61,0.14);color:var(--income);}
.fn-status-pill.warning{background:rgba(180,83,9,0.14);color:var(--warning);}
.fn-status-pill.danger{background:rgba(214,38,90,0.14);color:var(--expense);}

/* Bills mini */
.fn-bill-mini-list{display:flex;flex-direction:column;gap:11px;}
.fn-bill-mini{display:flex;align-items:center;gap:12px;}
.fn-bill-mini-info{flex:1;min-width:0;}
.fn-bill-mini-name{font-size:13px;font-weight:700;}
.fn-bill-mini-amount{font-weight:700;font-size:12.5px;flex-shrink:0;font-family:var(--font-display);}

/* Filters / journal */
.fn-filters-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px;}
.fn-search-input{display:flex;align-items:center;gap:9px;border-radius:14px;padding:11px 15px;flex:1;min-width:200px;color:var(--text-secondary);background:var(--bg);box-shadow:inset 3px 3px 7px var(--sd-soft), inset -3px -3px 7px var(--sl-soft);}
.fn-search-input input{border:none;background:none;outline:none;color:var(--text-primary);font-size:13px;width:100%;}
.fn-search-input.large{padding:16px 18px;}
.fn-select{border:none;border-radius:13px;padding:10px 13px;font-size:12.5px;font-weight:600;color:var(--text-primary);outline:none;background:var(--bg);box-shadow:inset 3px 3px 7px var(--sd-soft), inset -3px -3px 7px var(--sl-soft);}
.fn-select.full{width:100%;}
.fn-loadmore-btn{width:100%;margin-top:16px;padding:12px;border-radius:14px;border:none;background:var(--bg);box-shadow:5px 5px 10px var(--sd), -5px -5px 10px var(--sl);color:var(--text-secondary);font-size:12.5px;font-weight:700;}

/* Empty state */
.fn-empty-state{display:flex;flex-direction:column;align-items:center;text-align:center;padding:50px 20px;gap:6px;}
.fn-empty-illustration{width:68px;height:68px;border-radius:22px;background:var(--bg);box-shadow:inset 4px 4px 9px var(--sd-soft), inset -4px -4px 9px var(--sl-soft);color:var(--text-secondary);display:flex;align-items:center;justify-content:center;margin-bottom:8px;}
.fn-empty-title{font-weight:700;font-size:14px;}

/* Buttons */
.fn-primary-btn{display:flex;align-items:center;justify-content:center;gap:6px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border:none;border-radius:15px;padding:12px 20px;font-weight:700;font-size:13px;box-shadow:6px 6px 14px rgba(16,185,129,0.28), -3px -3px 10px var(--sl);}
.fn-primary-btn.small{padding:9px 14px;font-size:12px;border-radius:12px;}
.fn-primary-btn:disabled{opacity:0.4;box-shadow:none;cursor:not-allowed;}
.fn-ghost-btn{background:var(--bg);box-shadow:5px 5px 10px var(--sd), -5px -5px 10px var(--sl);border:none;border-radius:15px;padding:12px 20px;font-weight:700;font-size:13px;color:var(--text-primary);}
.fn-ghost-btn.small{padding:9px 14px;font-size:12px;border-radius:12px;}
.fn-ghost-btn:active, .fn-primary-btn:not(:disabled):active{box-shadow:inset 3px 3px 7px rgba(0,0,0,0.15);}
.fn-outline-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--bg);box-shadow:inset 3px 3px 7px var(--sd-soft), inset -3px -3px 7px var(--sl-soft);border:none;border-radius:14px;padding:11px;font-weight:700;font-size:12.5px;color:var(--text-secondary);}

/* FAB */
.fn-fab{position:fixed;bottom:30px;right:34px;display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border:none;padding:16px 24px;border-radius:99px;font-weight:700;font-size:13.5px;box-shadow:0 14px 30px rgba(16,185,129,0.38);z-index:40;}

/* Bottom nav */
.fn-bottom-nav{display:none;}

/* Inline forms */
.fn-inline-form{display:flex;flex-wrap:wrap;gap:9px;align-items:center;padding:14px;border-radius:18px;margin-bottom:18px;background:var(--bg);box-shadow:inset 3px 3px 7px var(--sd-soft), inset -3px -3px 7px var(--sl-soft);}
.fn-text-input{border:none;border-radius:13px;padding:10px 13px;font-size:13px;color:var(--text-primary);outline:none;width:100%;background:var(--bg);box-shadow:inset 3px 3px 7px var(--sd-soft), inset -3px -3px 7px var(--sl-soft);}
.fn-form-grid{display:grid;gap:13px;}
.fn-form-grid.two{grid-template-columns:1fr 1fr;}
.fn-field{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:var(--text-secondary);}

/* Budget page */
.fn-budget-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
.fn-budget-card{border-radius:18px;padding:17px;background:var(--bg);box-shadow:inset 3px 3px 8px var(--sd-soft), inset -3px -3px 8px var(--sl-soft);}
.fn-budget-numbers{display:flex;justify-content:space-between;margin-top:8px;font-size:12.5px;font-weight:800;font-family:var(--font-display);}
.fn-budget-warning{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;margin-top:11px;padding:9px 11px;border-radius:12px;}
.fn-budget-warning.warning{background:rgba(180,83,9,0.12);color:var(--warning);}
.fn-budget-warning.danger{background:rgba(214,38,90,0.12);color:var(--expense);}

/* Savings goals */

<script>
/* ======================================================================
   Helpers
====================================================================== */
const STORAGE_KEY = "finora_app_data_v1";
const TAB_ALIVE_KEY = "finora_tab_alive";
/* Kredensial sidik jari (WebAuthn) disimpan TERPISAH dari STORAGE_KEY dan
   TIDAK ikut disinkronkan ke cloud, karena kredensial ini terikat secara
   fisik ke sensor sidik jari/Face ID perangkat & browser ini saja. */
const WEBAUTHN_STORAGE_KEY = "finora_webauthn_v1";

/* Semua nominal transaksi disimpan dalam Rupiah (IDR) sebagai mata uang dasar.
   CURRENCY_META menyimpan kurs untuk ditampilkan dalam mata uang lain.
   Kurs diperbarui otomatis secara berkala dari API kurs real-time (fetchLiveRates),
   dan nilai rate di objek ini akan dimutasi langsung saat kurs baru diterima. */
const CURRENCY_META = {
  IDR:{label:"IDR — Rupiah", symbol:"Rp", rate:1, decimals:0},
  USD:{label:"USD — Dollar Amerika", symbol:"$", rate:1/16300, decimals:2},
  EUR:{label:"EUR — Euro", symbol:"€", rate:1/17700, decimals:2},
  SGD:{label:"SGD — Dollar Singapura", symbol:"S$", rate:1/12100, decimals:2},
  JPY:{label:"JPY — Yen Jepang", symbol:"¥", rate:1/108, decimals:0},
};
function getCurrencyMeta(){
  const cur = state.settingsCurrency || "IDR";
  return CURRENCY_META[cur] || CURRENCY_META.IDR;
}
/* Mengambil kurs terkini dari API publik gratis (open.er-api.com, tanpa API key)
   lalu menghitung ulang berapa Rupiah per 1 unit mata uang lain. Dipanggil saat
   aplikasi dibuka dan diulang otomatis tiap beberapa menit agar terus up-to-date. */
async function fetchLiveRates(showToast){
  try{
    const res = await fetch("https://open.er-api.com/v6/latest/USD");
    const data = await res.json();
    if (!data || data.result!=="success" || !data.rates || !data.rates.IDR) throw new Error("Respon kurs tidak valid");
    const idrPerUsd = data.rates.IDR;
    Object.keys(CURRENCY_META).forEach(code=>{
      if (code==="IDR") return;
      const idrPerUnit = code==="USD" ? idrPerUsd : (data.rates[code] ? idrPerUsd / data.rates[code] : null);
      if (idrPerUnit && isFinite(idrPerUnit) && idrPerUnit>0){
        CURRENCY_META[code].rate = 1/idrPerUnit;
      }
    });
    state.liveRatesUpdatedAt = new Date().toISOString();
    state.liveRatesError = "";
    saveData();
    const slot = document.getElementById("currencyCardBody");
    if (slot) slot.innerHTML = renderCurrencyCardBodyHTML();
    if (showToast) pushToast("Kurs mata uang berhasil diperbarui");
  } catch(e){
    state.liveRatesError = "Gagal memperbarui kurs (cek koneksi internet).";
    const slot = document.getElementById("currencyCardBody");
    if (slot) slot.innerHTML = renderCurrencyCardBodyHTML();
    if (showToast) pushToast("Gagal memperbarui kurs. Periksa koneksi internet.", "warning");
    console.warn("Finora: gagal mengambil kurs realtime.", e);
  }
}
const formatRupiah = (n) => {
  const meta = getCurrencyMeta();
  const sign = n < 0 ? "-" : "";
  const value = Math.abs(n) * meta.rate;
  const formatted = value.toLocaleString("id-ID", {minimumFractionDigits:meta.decimals, maximumFractionDigits:meta.decimals});
  return sign + meta.symbol + " " + formatted;
};
const MONTHS_ID = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
const DAYS_ID = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
const fmtDateLong = (d) => `${DAYS_ID[d.getDay()]}, ${d.getDate()} ${MONTHS_ID[d.getMonth()]} ${d.getFullYear()}`;
const fmtDateShort = (dateStr) => { const d = new Date(dateStr+"T00:00:00"); return `${d.getDate()} ${MONTHS_ID[d.getMonth()].slice(0,3)} ${d.getFullYear()}`; };
const fmtDateRelative = (dateStr) => {
  if (dateStr === todayStr) return "Hari ini";
  const d = new Date(dateStr+"T00:00:00"), t = new Date(todayStr+"T00:00:00");
  const diff = Math.round((t-d)/86400000);
  if (diff === 1) return "Kemarin";
  return fmtDateShort(dateStr);
};
const TODAY = new Date(2026,8,8);
const todayStr = TODAY.toISOString().slice(0,10);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const getInitials = (name) => (String(name||"").trim().split(/\s+/).slice(0,2).map(w=>w[0]||"").join("").toUpperCase() || "U");
function renderAvatarHTML(profile){
  if (profile.avatarDataUrl){
    return `<img src="${profile.avatarDataUrl}" class="fn-avatar-img" alt="Foto profil">`;
  }
  return esc(getInitials(profile.name));
}
const firstName = (name) => (String(name||"").trim().split(/\s+/)[0] || "");
const sanitizeDigits = (v) => String(v||"").replace(/[^0-9]/g, "");
const formatInputNumber = (digits) => digits ? Number(digits).toLocaleString("en-US") : "";
/* Format ulang nilai input nominal secara langsung di DOM (tanpa renderApp),
   supaya elemen input tidak pernah dilepas dari DOM saat mengetik —
   ini yang membuat keyboard hp tidak lagi menutup sendiri tiap ketikan. */
function liveFormatAmountInput(el, rawDigits){
  if (!el) return;
  const cursorPos = typeof el.selectionStart === "number" ? el.selectionStart : el.value.length;
  const digitsBeforeCursor = (el.value.slice(0, cursorPos).match(/[0-9]/g) || []).length;
  const formatted = formatInputNumber(rawDigits);
  el.value = formatted;
  let pos = formatted.length;
  if (digitsBeforeCursor === 0){ pos = 0; }
  else {
    let seen = 0;
    for (let i=0;i<formatted.length;i++){
      if (/[0-9]/.test(formatted[i])) seen++;
      if (seen === digitsBeforeCursor){ pos = i+1; break; }
    }
  }
  if (el.setSelectionRange){ try{ el.setSelectionRange(pos,pos); }catch(e){} }
}

  };
}
function saveData(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(collectPersistData())); }
  catch(e){ console.warn("Finora: gagal menyimpan data lokal.", e); }
  scheduleCloudSave();
}
function applyPersistData(d){
  if (!d || typeof d!=="object") return;
  if (d.theme) state.theme = d.theme;
  if (d.settingsCurrency) state.settingsCurrency = d.settingsCurrency;
  if (d.liveRates){ Object.keys(d.liveRates).forEach(k=>{ if (CURRENCY_META[k] && typeof d.liveRates[k]==="number") CURRENCY_META[k].rate = d.liveRates[k]; }); }
  if (d.liveRatesUpdatedAt) state.liveRatesUpdatedAt = d.liveRatesUpdatedAt;
  if (d.streak && typeof d.streak==="object") state.streak = {count:Number(d.streak.count)||0, lastDate:d.streak.lastDate||null};
  if (d.toggles) state.toggles = {...state.toggles, ...d.toggles};
  if (d.profile) state.profile = {...state.profile, ...d.profile};
  if (!firebaseReady){
    if (d.auth) state.auth = d.auth;
    if (typeof d.session === "boolean") state.session = d.session;
  }
  if (typeof d.txCounter === "number") txCounter = d.txCounter;
  if (Array.isArray(d.transactions)) transactions = d.transactions;
  if (Array.isArray(d.accounts) && d.accounts.length){ accounts = d.accounts; }
  if (Array.isArray(d.budgets)) budgets = d.budgets;
  if (Array.isArray(d.savingsGoals)) savingsGoals = d.savingsGoals;
  if (Array.isArray(d.allCategories) && d.allCategories.length) allCategories = d.allCategories;
  if (Array.isArray(d.bills)) bills = d.bills;
}
function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) applyPersistData(JSON.parse(raw));
  } catch(e){ console.warn("Finora: gagal memuat data lokal.", e); }

  /* Auto-lock: kalau tab/browser sebelumnya benar-benar ditutup (bukan
     sekadar di-refresh), paksa kembali ke layar login demi keamanan.
     sessionStorage otomatis hilang saat tab/browser ditutup, tapi tetap
     ada selama halaman cuma di-refresh (F5) di tab yang sama. */
  if (!firebaseReady){
    let tabAlive = false;
    try{ tabAlive = sessionStorage.getItem(TAB_ALIVE_KEY) === "1"; }catch(e){}
    if (!tabAlive) state.session = false;
  }
  try{ sessionStorage.setItem(TAB_ALIVE_KEY, "1"); }catch(e){}
}

/* ======================================================================
   Konfigurasi Firebase (OPSIONAL — untuk sinkronisasi cloud lintas perangkat
   & Login Google yang ASLI).

   Tanpa diisi, aplikasi tetap berjalan normal secara LOKAL (email + kata
   sandi disimpan di perangkat ini saja lewat localStorage, tidak sinkron
   ke perangkat lain, dan tombol "Lanjutkan dengan Google" disembunyikan).

   Cara mengaktifkan sinkronisasi cloud (gratis):
   1. Buka https://console.firebase.google.com -> "Add project" -> ikuti wizard.
   2. Di dashboard project, klik ikon web "</>" -> daftarkan app -> Firebase akan
      menampilkan objek firebaseConfig -> salin semua nilainya ke bawah ini.
   3. Menu Build > Authentication > Sign-in method -> aktifkan "Email/Password"
      dan "Google".
   4. Menu Build > Firestore Database -> "Create database" (mode production).
      Lalu di tab Rules, pakai aturan berikut supaya tiap user cuma bisa
      baca/tulis datanya sendiri:
        rules_version = '2';
        service cloud.firestore {
          match /databases/{database}/documents {
            match /finora_users/{uid} {
              allow read, write: if request.auth != null && request.auth.uid == uid;
            }
          }
        }
   5. Simpan file ini lagi -> refresh -> login/daftar dengan email atau Google
      akan otomatis tersimpan ke cloud dan bisa diakses dari perangkat manapun.
====================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "",
  authDomain: "",
  projectId: "",
  storageBucket: "",
  messagingSenderId: "",
  appId: "",
};
let firebaseReady = false;
let fbAuth = null, fbDb = null, fbUser = null;
try{
  if (FIREBASE_CONFIG.apiKey && typeof firebase !== "undefined"){
    firebase.initializeApp(FIREBASE_CONFIG);
    fbAuth = firebase.auth();
    fbDb = firebase.firestore();
    firebaseReady = true;
    /* Persistence SESSION (bukan default LOCAL) supaya perilaku "tutup tab/
       browser = otomatis logout" tetap konsisten walau memakai akun cloud. */
    fbAuth.setPersistence(firebase.auth.Auth.Persistence.SESSION).catch(e=>{
      console.warn("Finora: gagal mengatur session persistence Firebase.", e);
    });
    /* Ini yang benar-benar menyalakan status login setelah daftar/masuk/Google,
       dan menangani auto-login saat tab masih hidup (habis refresh, bukan
       tab/browser baru) selama Firebase juga menganggap sesi masih valid. */
    fbAuth.onAuthStateChanged(async (user) => {
      fbUser = user;
      if (user){
        state.authBusy = false;
        state.authError = "";
        await cloudLoadData();
        state.session = true;
        renderApp();
      } else {
        state.session = false;
        renderApp();
      }
    });
  }
}catch(e){ console.warn("Finora: Firebase tidak aktif / gagal inisialisasi.", e); }

function translateFirebaseError(e){
  const code = e && e.code;
  const map = {
    "auth/email-already-in-use":"Email ini sudah terdaftar. Coba menu Masuk, bukan Daftar.",
    "auth/invalid-email":"Format email tidak valid.",
    "auth/weak-password":"Kata sandi terlalu lemah (minimal 6 karakter).",
    "auth/user-not-found":"Email belum terdaftar. Silakan daftar akun baru dulu.",
    "auth/wrong-password":"Kata sandi salah.",
    "auth/invalid-credential":"Email atau kata sandi salah.",
    "auth/too-many-requests":"Terlalu banyak percobaan gagal. Coba lagi beberapa saat lagi.",
    "auth/popup-closed-by-user":"Login Google dibatalkan.",
    "auth/network-request-failed":"Gagal terhubung ke server. Cek koneksi internet.",
  };
  return (code && map[code]) || (e && e.message) || "Terjadi kesalahan. Coba lagi.";
}

/* ======================================================================
   Penyimpanan cloud (Firestore) — mirror dari collectPersistData(), hanya
   aktif kalau Firebase dikonfigurasi & user sedang login.
====================================================================== */
let cloudSaveTimer = null;
function scheduleCloudSave(){
  if (!firebaseReady || !fbUser) return;
  clearTimeout(cloudSaveTimer);
  cloudSaveTimer = setTimeout(()=>{
    fbDb.collection("finora_users").doc(fbUser.uid).set(collectPersistData())
      .catch(e=>console.warn("Finora: gagal sinkron ke cloud.", e));
  }, 1500);
}
async function cloudLoadData(){
  if (!firebaseReady || !fbUser) return false;
  try{
    const snap = await fbDb.collection("finora_users").doc(fbUser.uid).get();
    if (snap.exists){ applyPersistData(snap.data()); return true; }
  }catch(e){ console.warn("Finora: gagal memuat data dari cloud.", e); }
  return false;
}

/* ======================================================================
   Autentikasi
   - Kalau Firebase dikonfigurasi (lihat FIREBASE_CONFIG di atas): akun ASLI
     tersimpan di server Google (Firebase Auth), data ASLI tersinkron ke
     Firestore, dan bisa login dari perangkat manapun tanpa kehilangan data,
     termasuk lewat tombol "Lanjutkan dengan Google".
   - Kalau tidak dikonfigurasi: akun & kata sandi (di-hash sederhana) hanya
     tersimpan di perangkat/browser ini (localStorage) — bukan sistem
     keamanan tingkat server, dan TIDAK tersinkron ke perangkat lain.
   Di kedua mode, menutup tab/browser akan otomatis mengunci aplikasi
   (harus login ulang), tapi sekadar refresh halaman tidak akan logout.
====================================================================== */
const isValidEmail = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v||"").trim());
function simpleHash(str){
  let h1=1779033703,h2=3144134277,h3=1013904242,h4=2773480762;
  for (let i=0;i<str.length;i++){
    const k=str.charCodeAt(i);
    h1=h2^Math.imul(h1^k,597399067); h2=h3^Math.imul(h2^k,2869860233);
    h3=h4^Math.imul(h3^k,951274213); h4=h1^Math.imul(h4^k,2716044179);
  }
  h1=Math.imul(h3^(h1>>>18),597399067); h2=Math.imul(h4^(h2>>>22),2869860233);
  h3=Math.imul(h1^(h3>>>17),951274213); h4=Math.imul(h2^(h4>>>19),2716044179);
  return (h1>>>0).toString(16)+(h2>>>0).toString(16)+(h3>>>0).toString(16)+(h4>>>0).toString(16);
}

/* ======================================================================
   Login dengan Sidik Jari (WebAuthn — Face ID / Touch ID / sensor sidik
   jari HP / Windows Hello, tergantung apa yang tersedia di perangkat).

   CARA KERJA:
   Browser (bukan kode kita) yang langsung memanggil sensor biometrik
   perangkat lewat API navigator.credentials. Kode di sini TIDAK PERNAH
   melihat data sidik jari itu sendiri — hanya menerima "berhasil" atau
   "gagal" dari sistem operasi, plus sebuah kredensial acak yang sudah
   dipasangkan khusus untuk perangkat & browser ini.

   MODE AKUN LOKAL (tanpa Firebase, mode default file ini): setelah
   kredensial terdaftar, tombol sidik jari bisa langsung menggantikan
   isi email + kata sandi untuk membuka sesi di perangkat ini.

   MODE AKUN CLOUD (Firebase aktif): kredensial WebAuthn TETAP bisa
   didaftarkan & dipakai untuk membuka kembali sesi Firebase yang masih
   aktif di tab ini (mis. setelah layar dikunci) tanpa mengetik ulang kata
   sandi. Tapi WebAuthn di sisi browser saja tidak bisa membuat sesi
   Firebase baru dari nol (setelah tab/browser benar-benar ditutup) tanpa
   server tambahan yang memverifikasi kredensial itu lalu menerbitkan
   Firebase custom token — jadi untuk kasus itu, login email/password atau
   Google tetap diperlukan sekali agar sesi Firebase aktif kembali.
====================================================================== */
function isSecureContextOk(){
  try{ return window.isSecureContext !== false; }catch(e){ return true; }
}
function webauthnSupportedCheck(){
  return !!(isSecureContextOk() && window.PublicKeyCredential && navigator.credentials && navigator.credentials.create && navigator.credentials.get);
}
async function initWebauthnAvailability(){
  state.webauthnSupported = webauthnSupportedCheck();
  if (!state.webauthnSupported) return;
  try{
    const avail = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
    state.webauthnAvailable = !!avail;
  }catch(e){
    state.webauthnAvailable = false;
  }
  renderApp();
}
function randomBytes(len){
  const arr = new Uint8Array(len);
  crypto.getRandomValues(arr);
  return arr;
}
function bufToBase64url(buf){
  const bytes = new Uint8Array(buf);
  let bin = "";
  for (let i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function base64urlToBuf(b64url){
  let b64 = b64url.replace(/-/g,"+").replace(/_/g,"/");
  while (b64.length % 4) b64 += "=";
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}
function loadWebauthnRecord(){
  try{
    const raw = localStorage.getItem(WEBAUTHN_STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function saveWebauthnRecord(rec){
  try{ localStorage.setItem(WEBAUTHN_STORAGE_KEY, JSON.stringify(rec)); }
  catch(e){ console.warn("Finora: gagal menyimpan kredensial sidik jari.", e); }
}
function clearWebauthnRecord(){
  try{ localStorage.removeItem(WEBAUTHN_STORAGE_KEY); }catch(e){}
}
function currentAccountEmailForWebauthn(){
  if (firebaseReady) return fbUser ? fbUser.email : (state.authForm.email||"").trim();
  return state.auth ? state.auth.email : "";
}
function isFingerprintRegistered(){
  const rec = loadWebauthnRecord();
  return !!(rec && rec.credentialId);
}
async function registerFingerprintLogin(){
  if (!state.webauthnSupported){ pushToast("Perangkat/browser ini belum mendukung login sidik jari.","warning"); return; }
  if (!state.webauthnAvailable){ pushToast("Tidak terdeteksi sensor sidik jari/Face ID di perangkat ini.","warning"); return; }
  const email = currentAccountEmailForWebauthn();
  if (!email){ pushToast("Email akun tidak ditemukan.","warning"); return; }
  if (state.webauthnBusy) return;
  state.webauthnBusy = true;
  try{
    const userId = randomBytes(16);
    const cred = await navigator.credentials.create({
      publicKey:{
        challenge: randomBytes(32),
        rp:{ name:"Finora" },
        user:{ id:userId, name:email, displayName: state.profile.name || email },
        pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],
        authenticatorSelection:{ authenticatorAttachment:"platform", userVerification:"required", residentKey:"preferred" },
        timeout:60000,
        attestation:"none",
      }
    });
    if (!cred){ throw new Error("Pendaftaran dibatalkan."); }
    saveWebauthnRecord({ email, credentialId: bufToBase64url(cred.rawId), mode: firebaseReady ? "cloud" : "local", createdAt: new Date().toISOString() });
    state.webauthnBusy = false;
    renderApp();
    pushToast("Login sidik jari berhasil diaktifkan untuk perangkat ini");
  }catch(e){
    state.webauthnBusy = false;
    renderApp();
    pushToast(e && e.name==="NotAllowedError" ? "Pendaftaran sidik jari dibatalkan." : "Gagal mengaktifkan sidik jari. Coba lagi.", "warning");
  }
}
function disableFingerprintLogin(){
  clearWebauthnRecord();
  renderApp();
  pushToast("Login sidik jari dinonaktifkan untuk perangkat ini","warning");
}
async function loginWithFingerprint(){
  const rec = loadWebauthnRecord();
  if (!rec || !rec.credentialId){ pushToast("Belum ada sidik jari terdaftar di perangkat ini.","warning"); return; }
  if (!state.webauthnSupported || !state.webauthnAvailable){ pushToast("Sensor sidik jari tidak tersedia di perangkat ini.","warning"); return; }
  if (state.webauthnBusy) return;
  state.webauthnBusy = true; renderApp();
  try{
    const assertion = await navigator.credentials.get({
      publicKey:{
        challenge: randomBytes(32),
        allowCredentials:[{ id: base64urlToBuf(rec.credentialId), type:"public-key", transports:["internal"] }],
        userVerification:"required",
        timeout:60000,
      }
    });
    if (!assertion) throw new Error("Verifikasi dibatalkan.");
    state.webauthnBusy = false;
    if (rec.mode==="cloud"){
      /* Mode cloud: hanya membuka kembali sesi Firebase yang MASIH aktif
         di tab ini (mis. layar terkunci sementara), bukan login dari nol. */
      if (firebaseReady && fbUser){
        state.session = true;
        state.authError = "";
        renderApp();
        pushToast(`Selamat datang kembali, ${state.profile.name||rec.email}!`);
      } else {
        renderApp();
        pushToast("Sesi cloud sudah berakhir. Masuk sekali lagi dengan email/Google untuk menyalakan ulang sesi.","warning");
      }
      return;
    }
    /* Mode lokal: sidik jari langsung menggantikan email + kata sandi. */
    if (!state.auth || state.auth.email !== rec.email){
      renderApp();
      pushToast("Sidik jari ini terdaftar untuk akun lain di perangkat ini.","warning");
      return;
    }
    state.session = true;
    state.authError = "";
    state.authForm = {email:"",password:"",password2:""};
    renderApp();
    pushToast(`Selamat datang kembali, ${state.profile.name||rec.email}!`);
  }catch(e){
    state.webauthnBusy = false;
    renderApp();
    pushToast(e && e.name==="NotAllowedError" ? "Verifikasi sidik jari dibatalkan/gagal." : "Gagal memverifikasi sidik jari.", "warning");
  }
}

/* ======================================================================
   Derived data
====================================================================== */
function isSameMonth(dateStr, ref){
  const d = new Date(dateStr+"T00:00:00");
  return d.getFullYear()===ref.getFullYear() && d.getMonth()===ref.getMonth();
}
function sumType(arr, type){ return arr.filter(t=>t.type===type).reduce((s,t)=>s+t.amount,0); }
function pctChange(cur, prev){ return prev===0 ? 0 : ((cur-prev)/prev)*100; }

function getAggregates(){
  const lastMonthRef = new Date(TODAY.getFullYear(), TODAY.getMonth()-1, 1);
  const thisMonthTx = transactions.filter(t=>isSameMonth(t.date, TODAY));
  const lastMonthTx = transactions.filter(t=>isSameMonth(t.date, lastMonthRef));
  const totalBalance = accounts.reduce((s,a)=>s+a.balance,0);
  const incomeThisMonth = sumType(thisMonthTx,"income");
  const expenseThisMonth = sumType(thisMonthTx,"expense");
  const incomeLastMonth = sumType(lastMonthTx,"income");
  const expenseLastMonth = sumType(lastMonthTx,"expense");
  const totalSavings = savingsGoals.reduce((s,g)=>s+g.current,0);
  const savingsTarget = savingsGoals.reduce((s,g)=>s+g.target,0);
  return {thisMonthTx,lastMonthTx,totalBalance,incomeThisMonth,expenseThisMonth,incomeLastMonth,expenseLastMonth,totalSavings,savingsTarget};
}

/* Menghitung pemasukan/pengeluaran per bulan murni dari transaksi asli pengguna,
   dari bulan (monthsCount-1) yang lalu sampai bulan berjalan (TODAY). Bulan yang
   tidak punya transaksi sama sekali otomatis bernilai 0, tidak ada data bohongan. */
function buildMonthlySeries(monthsCount){
  const out = [];
  for (let i = monthsCount-1; i>=0; i--){
    const d = new Date(TODAY.getFullYear(), TODAY.getMonth()-i, 1);
    const y = d.getFullYear(), m = d.getMonth();
    const label = `${MONTHS_ID[m].slice(0,3)} ${String(y).slice(2)}`;
    const monthTx = transactions.filter(t=>{
      const td = new Date(t.date+"T00:00:00");
      return td.getFullYear()===y && td.getMonth()===m && t.type!=="transfer";
    });
    out.push({label, income: sumType(monthTx,"income"), expense: sumType(monthTx,"expense")});
  }
  return out;
}

function buildCashflowSeries(range){
  if (range==="7d" || range==="30d"){
    const days = range==="7d"?7:30;
    const out = [];
    for (let i=days-1;i>=0;i--){
      const d = new Date(TODAY); d.setDate(d.getDate()-i);
      const dateStr = d.toISOString().slice(0,10);
      const dayTx = transactions.filter(t=>t.date===dateStr && t.type!=="transfer");
      out.push({label:`${d.getDate()}/${d.getMonth()+1}`, income:sumType(dayTx,"income"), expense:sumType(dayTx,"expense")});
    }
    return out;
  }
  const monthsCount = range==="3m"?3:range==="6m"?6:12;
  return buildMonthlySeries(monthsCount);
}

function buildInsights(thisMonthTx){
  const insights = [];
  const expByCat = {};
  thisMonthTx.filter(t=>t.type==="expense").forEach(t=>{ expByCat[t.categoryId]=(expByCat[t.categoryId]||0)+t.amount; });
  const topCatId = Object.keys(expByCat).sort((a,b)=>expByCat[b]-expByCat[a])[0];
  if (topCatId){ const cat=getCategory(topCatId); insights.push(`Pengeluaran terbesar bulan ini adalah ${cat.name} sebesar ${formatRupiah(expByCat[topCatId])}.`); }
  const lastMonthRef = new Date(TODAY.getFullYear(), TODAY.getMonth()-1, 1);
  const lastMonthExp = transactions.filter(t=>{ const d=new Date(t.date+"T00:00:00"); return t.type==="expense" && d.getFullYear()===lastMonthRef.getFullYear() && d.getMonth()===lastMonthRef.getMonth(); }).reduce((s,t)=>s+t.amount,0);
  const thisMonthExp = thisMonthTx.filter(t=>t.type==="expense").reduce((s,t)=>s+t.amount,0);
  if (lastMonthExp>0){ const diff=((thisMonthExp-lastMonthExp)/lastMonthExp)*100; insights.push(`Pengeluaran kamu bulan ini ${Math.abs(diff).toFixed(0)}% ${diff<=0?"lebih rendah":"lebih tinggi"} dibanding bulan lalu.`); }
  const goal = savingsGoals.find(g=>g.current<g.target);
  if (goal){ const monthsLeft=Math.max(1,Math.round((new Date(goal.deadline)-TODAY)/(30*86400000))); const perMonth=Math.ceil((goal.target-goal.current)/monthsLeft); insights.push(`Untuk mencapai target "${goal.name}", kamu perlu menabung sekitar ${formatRupiah(perMonth)}/bulan.`); }
  return insights.slice(0,3);
}

function getNotifications(thisMonthTx){
  const list = [];
  budgets.forEach(b=>{
    const spent = thisMonthTx.filter(t=>t.type==="expense"&&t.categoryId===b.categoryId).reduce((s,t)=>s+t.amount,0);
    const pct = (spent/b.amount)*100;
    if (pct>=80){ const cat=getCategory(b.categoryId); list.push({id:`b${b.id}`,icon:"alertTriangle",tone:"warning",text:`Budget ${cat.name.toLowerCase()} kamu sudah mencapai ${Math.round(pct)}% dari batas bulan ini.`}); }
  });
  if (state.toggles.billReminder){
    bills.filter(b=>b.status!=="paid").forEach(b=>{
      const days = Math.round((new Date(b.dueDate+"T00:00:00")-TODAY)/86400000);
      if (days<0){ list.push({id:`bill${b.id}`,icon:"alertTriangle",tone:"warning",text:`Tagihan ${b.name} sudah lewat jatuh tempo ${Math.abs(days)} hari! Segera bayar ya.`}); }
      else if (days<=7){ list.push({id:`bill${b.id}`,icon:"bell",tone:"info",text:`Tagihan ${b.name} jatuh tempo dalam ${days} hari.`}); }
    });
  }
  savingsGoals.forEach(g=>{
    const pct=(g.current/g.target)*100;
    if (pct>=100) list.push({id:`g${g.id}`,icon:"checkCircle",tone:"success",text:`Target tabungan "${g.name}" sudah tercapai! 🎉`});
    else if (pct>=50 && pct<65) list.push({id:`g${g.id}b`,icon:"target",tone:"success",text:`Kamu berhasil mencapai ${Math.round(pct)}% target "${g.name}".`});
  });
  return list;
}

/* ======================================================================
   Transaction actions
====================================================================== */
function addTransactionSubmit(){
  const f = state.modalForm;
  if (!(f.amount && Number(f.amount)>0 && f.description.trim())) return;
  if (f.type==="transfer" && f.accountId===f.toAccountId) return;
  const amount = Number(f.amount);
  if (f.type==="transfer"){
    accounts.forEach(a=>{ if (a.id===f.accountId) a.balance-=amount; if (a.id===f.toAccountId) a.balance+=amount; });
  } else {
    accounts.forEach(a=>{ if (a.id===f.accountId) a.balance += (f.type==="income"?amount:-amount); });
  }
  transactions.unshift(mkTx(f.type,f.date,f.type==="transfer"?"other_expense":f.categoryId,f.description.trim(),amount,f.accountId,f.method,f.note));
  state.addModalOpen = false;
  state.modalForm = {type:"expense",amount:"",categoryId:expenseCategories[0].id,description:"",date:todayStr,accountId:accounts[0].id,toAccountId:accounts[1].id,method:methods[0],note:""};
  renderApp();
  pushToast(f.type==="transfer" ? "Transfer berhasil dicatat" : "Transaksi berhasil ditambahkan");
}
function deleteTransactionById(id){
  const t = transactions.find(x=>x.id===id);
  if (!t) return;
  if (t.type!=="transfer"){ accounts.forEach(a=>{ if(a.id===t.accountId) a.balance -= (t.type==="income"?t.amount:-t.amount); }); }
  transactions = transactions.filter(x=>x.id!==id);
  renderApp();
  pushToast("Transaksi dihapus","warning");
}

  if (chartRegistry.cashflow) chartRegistry.cashflow.destroy();
  chartRegistry.cashflow = new Chart(canvas.getContext("2d"), {
    type:"line",
    data:{
      labels: data.map(d=>d.label),
      datasets:[
        {label:"Pemasukan", data:data.map(d=>d.income), borderColor:c.income, backgroundColor:hexToRgba(c.income,0.16), fill:true, tension:0.35, borderWidth:2.5, pointRadius:0},

      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      interaction:{mode:"index", intersect:false},
      plugins:{ legend:{display:false}, tooltip:{ backgroundColor:c.tooltipBg, titleColor:c.textPrimary, bodyColor:c.textPrimary, borderColor:c.grid, borderWidth:1, padding:12, cornerRadius:10, callbacks:{ label:(ctx)=> `${ctx.dataset.label}: ${formatRupiah(ctx.parsed.y)}` } } },
      scales:{

    }
  });
}
function hexToRgba(hex, alpha){
  if (hex.startsWith("rgb")) return hex;
  const h = hex.replace("#","");
  const bigint = parseInt(h.length===3 ? h.split("").map(c=>c+c).join("") : h, 16);
  const r=(bigint>>16)&255, g=(bigint>>8)&255, b=bigint&255;
  return `rgba(${r},${g},${b},${alpha})`;
}

/* ======================================================================
   Saving streak
   Streak menyala hanya jika user benar-benar menambah tabungan hari ini
   atau kemarin (tanpa putus sehari pun). Mengurangi saldo (koreksi salah
   ketik) tidak dihitung sebagai aktivitas menabung, jadi tidak menyalakan
   ataupun memperpanjang streak.
====================================================================== */
function dateKey(d){ return d.toISOString().slice(0,10); }
function recordSavingsStreak(){
  const todayKey = dateKey(new Date());
  const s = state.streak;
  if (s.lastDate === todayKey) return;
  if (s.lastDate){
    const diffDays = Math.round((new Date(todayKey) - new Date(s.lastDate)) / 86400000);
    s.count = diffDays === 1 ? s.count + 1 : 1;
  } else {
    s.count = 1;
  }
  s.lastDate = todayKey;
}
function getStreakDisplay(){
  const s = state.streak;
  if (!s.lastDate) return {count:0, alive:false};
  const todayKey = dateKey(new Date());
  const yesterdayKey = dateKey(new Date(Date.now()-86400000));
  const alive = s.lastDate===todayKey || s.lastDate===yesterdayKey;
  return {count: alive ? s.count : 0, alive};
}

function startSavingsAdd(id, mode){
  state.savingsAddingTo=id;
  state.savingsAmount="";
  state.savingsAddMode = mode || "add";
  renderApp();
  setTimeout(()=>{ const el=document.getElementById("savingsAmountInput"); if(el) el.focus(); },0);
}
function cancelSavingsAdd(){ state.savingsAddingTo=null; state.savingsAmount=""; state.savingsAddMode="add"; renderApp(); }
function setSavingsAmount(v){
  const digits = sanitizeDigits(v);
  state.savingsAmount = digits;
  liveFormatAmountInput(document.getElementById("savingsAmountInput"), digits);
}
function confirmSavingsAdd(id){
  const val = Number(state.savingsAmount);
  if (!val || val<=0) return;
  const mode = state.savingsAddMode || "add";
  savingsGoals = savingsGoals.map(g=>{
    if (g.id!==id) return g;
    const next = mode==="subtract" ? Math.max(0, g.current-val) : Math.min(g.target, g.current+val);
    return {...g, current: next};
  });
  if (mode==="add") recordSavingsStreak();
  state.savingsAddingTo=null; state.savingsAmount=""; state.savingsAddMode="add";
  renderApp();
  pushToast(mode==="subtract" ? "Saldo tabungan berhasil dikurangi" : "Tabungan berhasil ditambahkan");
}

function shadeColor(hex, percent){
  hex = String(hex||"#10B981").replace("#","");
  if (hex.length===3) hex = hex.split("").map(c=>c+c).join("");
  const num = parseInt(hex,16) || 0;
  let r = (num>>16) + Math.round(2.55*percent);
  let g = ((num>>8)&0x00FF) + Math.round(2.55*percent);
  let b = (num&0x0000FF) + Math.round(2.55*percent);
  r = Math.min(255,Math.max(0,r)); g = Math.min(255,Math.max(0,g)); b = Math.min(255,Math.max(0,b));
  return "#" + [r,g,b].map(v=>v.toString(16).padStart(2,"0")).join("");
}

function relativeTimeFromNow(iso){
  if (!iso) return null;
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diffMs/60000);
  if (mins < 1) return "baru saja";
  if (mins < 60) return `${mins} menit lalu`;
  const hours = Math.floor(mins/60);
  if (hours < 24) return `${hours} jam lalu`;
  const days = Math.floor(hours/24);
  return `${days} hari lalu`;
}

/* Foto profil dari galeri: dibaca via FileReader, di-crop persegi & diperkecil
   lewat canvas (maks 240x240, kompresi JPEG) sebelum disimpan sebagai data URL,
   supaya ukurannya kecil dan aman disimpan di localStorage/Firestore. */
function handleAvatarFileChange(input){
  const file = input.files && input.files[0];
  if (!file) return;
  if (!file.type || !file.type.startsWith("image/")){
    pushToast("File yang dipilih harus berupa gambar","warning");
    input.value = "";
    return;
  }
  if (file.size > 8*1024*1024){
    pushToast("Ukuran gambar terlalu besar (maks 8MB)","warning");
    input.value = "";
    return;
  }
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const size = 240;
      const canvas = document.createElement("canvas");
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext("2d");
      const minSide = Math.min(img.width, img.height) || size;
      const sx = (img.width - minSide) / 2, sy = (img.height - minSide) / 2;
      ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);
      let dataUrl;
      try{ dataUrl = canvas.toDataURL("image/jpeg", 0.85); }
      catch(err){ pushToast("Gagal memproses gambar","warning"); return; }
      state.profile.avatarDataUrl = dataUrl;
      renderApp();
      pushToast("Foto profil berhasil diperbarui");
    };
    img.onerror = () => pushToast("Gagal membaca file gambar","warning");
    img.src = e.target.result;
  };
  reader.onerror = () => pushToast("Gagal membaca file gambar","warning");
  reader.readAsDataURL(file);
  input.value = "";
}

async function submitPasswordChange(){
  const sf = state.securityForm;
  if (sf.newPass.length<6){ pushToast("Kata sandi baru minimal 6 karakter","warning"); return; }
  if (sf.newPass!==sf.confirm){ pushToast("Konfirmasi kata sandi baru tidak cocok","warning"); return; }
  if (firebaseReady){
    if (!fbUser){ pushToast("Sesi login tidak ditemukan, coba masuk ulang.","warning"); return; }
    try{
      const cred = firebase.auth.EmailAuthProvider.credential(fbUser.email, sf.current);
      await fbUser.reauthenticateWithCredential(cred);
      await fbUser.updatePassword(sf.newPass);
      state.securityForm = {open:false,current:"",newPass:"",confirm:""};
      renderApp();
      pushToast("Kata sandi berhasil diperbarui");
    }catch(e){
      pushToast(translateFirebaseError(e), "warning");
    }
    return;
  }
  if (!state.auth || simpleHash(sf.current)!==state.auth.passwordHash){ pushToast("Kata sandi saat ini salah","warning"); return; }
  state.auth.passwordHash = simpleHash(sf.newPass);
  state.securityForm = {open:false,current:"",newPass:"",confirm:""};
  renderApp();
  pushToast("Kata sandi berhasil diperbarui");
}

  [["nasi","makan","kopi","sarapan","resto","warteg","gofood"], "food"],
  [["grab","gojek","bensin","parkir","tol","ojek"], "transport"],
  [["baju","sepatu","belanja","tas"], "shopping"],
  [["listrik","air","internet","wifi","pulsa"], "bills"],
  [["nonton","bioskop","game","konser"], "entertainment"],
  [["dokter","obat","rumah sakit","vitamin"], "health"],
  [["kursus","buku","sekolah","kuliah"], "education"],
  [["netflix","spotify","youtube","langganan"], "subscription"],
];
function getSuggestion(desc){
  const d = desc.toLowerCase();
  const hit = categorySuggestRules.find(([keys])=>keys.some(k=>d.includes(k)));
  return hit ? hit[1] : null;
}
function renderSuggestionChipHTML(f){
  const suggested = f.type==="expense" ? getSuggestion(f.description||"") : null;
  return (suggested && suggested!==f.categoryId) ? `<button class="fn-suggestion-chip" onclick="applySuggestion('${suggested}')">✨ Gunakan kategori "${getCategory(suggested).name}"?</button>` : "";
}
function renderAddModal(){
  const f = state.modalForm;
  const catList = f.type==="income" ? allCategories.filter(c=>incomeCategories.some(i=>i.id===c.id)||c.type==="income") : allCategories.filter(c=>expenseCategories.some(e=>e.id===c.id)||c.type==="expense");
  const canSubmit = f.amount && Number(f.amount)>0 && f.description.trim() && (f.type!=="transfer" || f.accountId!==f.toAccountId);

  return `
  <div class="fn-modal-overlay" onclick="closeAddModal()">
    <div class="fn-modal" onclick="event.stopPropagation()">
      <div class="fn-modal-header"><h3>Tambah Transaksi</h3><button class="fn-icon-btn" style="width:36px;height:36px;" onclick="closeAddModal()">${icon("x",16)}</button></div>
      <div class="fn-type-tabs">
        ${[["expense","Pengeluaran"],["income","Pemasukan"],["transfer","Transfer"]].map(([k,l])=>`<button class="fn-type-tab ${f.type===k?"active "+k:""}" onclick="setModalType('${k}')">${l}</button>`).join("")}
      </div>
      <div class="fn-modal-body">
        <label class="fn-field"><span>Nominal</span>
          <div class="fn-amount-input"><span>Rp</span><input id="modalAmount" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="0" value="${formatInputNumber(f.amount)}" oninput="setModalField('amount', this.value)"></div>
        </label>
        <label class="fn-field"><span>Deskripsi</span>
          <input id="modalDescription" class="fn-text-input" placeholder="cth. Makan siang nasi goreng" value="${esc(f.description)}" oninput="setModalField('description', this.value)">
        </label>
        <div id="suggestionChipSlot">${renderSuggestionChipHTML(f)}</div>
        ${f.type!=="transfer" ? `
        <label class="fn-field"><span>Kategori</span>
          <select class="fn-select full" onchange="setModalField('categoryId', this.value)">
            ${catList.map(c=>`<option value="${c.id}" ${f.categoryId===c.id?"selected":""}>${c.name}</option>`).join("")}
          </select>
        </label>` : `
        <label class="fn-field"><span>Ke Akun</span>
          <select class="fn-select full" onchange="setModalField('toAccountId', this.value)">
            ${accounts.filter(a=>a.id!==f.accountId).map(a=>`<option value="${a.id}" ${f.toAccountId===a.id?"selected":""}>${a.name}</option>`).join("")}
          </select>
        </label>`}
        <div class="fn-form-grid two">
          <label class="fn-field"><span>Tanggal</span><input class="fn-text-input" type="date" value="${f.date}" onchange="setModalField('date', this.value)"></label>
          <label class="fn-field"><span>Akun</span>
            <select class="fn-select full" onchange="setModalField('accountId', this.value)">
              ${accounts.map(a=>`<option value="${a.id}" ${f.accountId===a.id?"selected":""}>${a.name}</option>`).join("")}
            </select>
          </label>
        </div>
        ${f.type!=="transfer" ? `
        <label class="fn-field"><span>Metode Pembayaran</span>
          <select class="fn-select full" onchange="setModalField('method', this.value)">
            ${methods.map(m=>`<option value="${m}" ${f.method===m?"selected":""}>${m}</option>`).join("")}
          </select>
        </label>` : ""}
        <label class="fn-field"><span>Catatan (opsional)</span>
          <input id="modalNote" class="fn-text-input" placeholder="Tambahkan catatan..." value="${esc(f.note)}" oninput="setModalField('note', this.value)">
        </label>
      </div>
      <div class="fn-modal-footer">
        <button class="fn-ghost-btn" onclick="closeAddModal()">Batal</button>
        <button id="addModalSubmitBtn" class="fn-primary-btn" ${canSubmit?"":"disabled"} onclick="addTransactionSubmit()">Simpan Transaksi</button>
      </div>
    </div>
  </div>`;
}
function setModalType(t){
  state.modalForm.type = t;
  const catList = t==="income" ? allCategories.filter(c=>incomeCategories.some(i=>i.id===c.id)||c.type==="income") : allCategories.filter(c=>expenseCategories.some(e=>e.id===c.id)||c.type==="expense");
  if (catList.length) state.modalForm.categoryId = catList[0].id;
  renderApp();
}
function updateAddModalLiveState(){
  const f = state.modalForm;
  const btn = document.getElementById("addModalSubmitBtn");
  if (btn){
    const canSubmit = f.amount && Number(f.amount)>0 && f.description.trim() && (f.type!=="transfer" || f.accountId!==f.toAccountId);
    btn.disabled = !canSubmit;
  }
  const slot = document.getElementById("suggestionChipSlot");
  if (slot) slot.innerHTML = renderSuggestionChipHTML(f);
}
function setModalField(key, val){
  if (key==="amount"){
    const digits = sanitizeDigits(val);
    state.modalForm.amount = digits;
    liveFormatAmountInput(document.getElementById("modalAmount"), digits);
    updateAddModalLiveState();
  } else if (key==="description"){
    state.modalForm.description = val;
    updateAddModalLiveState();
  } else if (key==="note"){
    state.modalForm.note = val;
  } else {
    state.modalForm[key]=val; renderApp();
  }
}
function applySuggestion(catId){ state.modalForm.categoryId = catId; renderApp(); }

/* ======================================================================
   Global search modal
====================================================================== */
function renderSearchResultsHTML(){
  const q = state.searchQuery;
  if (!q) return "";
  const results = transactions.filter(t=>{
    const cat = getCategory(t.categoryId);
    const ql = q.toLowerCase();
    return t.description.toLowerCase().includes(ql) || cat.name.toLowerCase().includes(ql) || (t.note||"").toLowerCase().includes(ql) || String(t.amount).includes(q);
  }).slice(0,8);
  return `
      <div class="fn-search-results">
        ${results.length===0 ? `<div class="fn-empty-mini">Tidak ditemukan hasil untuk "${esc(q)}"</div>` : results.map(t=>`
          <div class="fn-tx-row" style="cursor:pointer;" onclick="goToJournalFromSearch()">
            <div class="icon-badge" style="width:34px;height:34px;background:${getCategory(t.categoryId).color}22;">${getCategory(t.categoryId).emoji}</div>
            <div class="fn-tx-info"><div class="fn-tx-name">${esc(t.description)}</div><div class="fn-tx-meta">${getCategory(t.categoryId).name} · ${fmtDateShort(t.date)}</div></div>
            <div class="fn-tx-amount ${t.type}">${formatRupiah(t.amount)}</div>
          </div>`).join("")}
        ${results.length>0 ? `<button class="fn-loadmore-btn" onclick="goToJournalFromSearch()">Lihat semua hasil di Jurnal Transaksi</button>` : ""}
      </div>`;
}
function renderSearchModal(){
  const q = state.searchQuery;
  return `
  <div class="fn-modal-overlay" onclick="closeSearch()">
    <div class="fn-search-modal" onclick="event.stopPropagation()">
      <div class="fn-search-input large">
        ${icon("search",18)}
        <input id="globalSearchInput" placeholder="Cari transaksi, kategori, nominal, catatan..." value="${esc(q)}" oninput="onGlobalSearch(this.value)">
        <kbd>ESC</kbd>
      </div>
      <div id="searchResultsSlot">${renderSearchResultsHTML()}</div>
    </div>
  </div>`;
}
function onGlobalSearch(v){
  state.searchQuery = v;
  const slot = document.getElementById("searchResultsSlot");
  if (slot) slot.innerHTML = renderSearchResultsHTML();
}
function goToJournalFromSearch(){
  state.journal.query = state.searchQuery;
  state.journal.visibleCount = 12;
  state.searchOpen = false;
  state.page = "journal";
  state.searchQuery = "";
  renderApp();
}

/* ======================================================================
   Empty state
====================================================================== */
function renderEmpty(text, sub){
  return `<div class="fn-empty-state"><div class="fn-empty-illustration">${icon("journal",28)}</div><div class="fn-empty-title">${esc(text)}</div>${sub?`<div class="fn-summary-sub">${esc(sub)}</div>`:""}</div>`;
}

/* ======================================================================
   Init
====================================================================== */
loadData();
renderApp();
initWebauthnAvailability();
fetchLiveRates(false);
setInterval(()=>fetchLiveRates(false), 30*60*1000);

/* Perbarui tanggal & jam di bawah sapaan secara berkala tanpa render ulang penuh */
setInterval(()=>{
  if (!state.session) return;
  const el = document.querySelector(".fn-subtext");
  if (el) el.textContent = fmtDateLong(new Date());
}, 60000);
</script>
</body>
</html>
